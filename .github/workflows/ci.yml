name: Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4.2.2
    
    - name: Use Node.js
      uses: actions/setup-node@v4.1.0
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Build
      run: npm run build

    - name: Run Telemetry & API Test Suite
      run: node ../tests/run_all.mjs https://pokitrainer.vercel.app
